name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE="$SDK_ROOT/cmdline-tools/latest/bin"
          if [ ! -x "$CMDLINE/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools/temp"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
            unzip -q /tmp/cmdline.zip -d "$SDK_ROOT/cmdline-tools/temp"
            mv "$SDK_ROOT/cmdline-tools/temp/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$SDK_ROOT/cmdline-tools/temp" /tmp/cmdline.zip
          fi
          yes | "$CMDLINE/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$CMDLINE/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.5 --distribution-type bin
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bmth-app-debug
          path: app/build/outputs/apk/debug/*.apk
