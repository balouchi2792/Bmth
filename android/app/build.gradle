plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.bmth.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "ir.bmth.tracker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // هنگام افزودن کتابخانه بومی Node.js، وابستگی nodejs-mobile در اینجا قرار می‌گیرد
}
