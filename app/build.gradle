plugins {
    id "com.android.application"
}

android {
    namespace "com.bmth.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.bmth.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
